name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Electron App
        run: |
          cat << 'EOF' > package.json
          {
            "name": "iti-attendance-master",
            "version": "1.0.0",
            "main": "main.js"
          }
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow, Menu } = require('electron');

          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1366,
              height: 850,
              minWidth: 1024,
              minHeight: 650,
              title: 'ITI Attendance Master',
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            Menu.setApplicationMenu(null);
            mainWindow.loadURL('https://ais-pre-imficyxjd7as3oyhv26rw2-489790092467.asia-southeast1.run.app');
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          npm install electron@30.0.0 --save-dev

      - name: Package Windows .EXE
        run: |
          npx --yes @electron/packager . "ITI Attendance Master" --platform=win32 --arch=x64 --out=dist-win --overwrite

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Attendance-Master-Windows
          path: dist-win/
