name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Package and Electron App
        run: |
          cat << 'EOF' > package.json
          {
            "name": "iti-attendance-master",
            "version": "1.0.0",
            "main": "main.js",
            "description": "ITI Attendance Master Desktop App",
            "author": "ITI Bilha",
            "scripts": {
              "dist": "electron-builder --win nsis --x64"
            },
            "build": {
              "appId": "com.itibilha.attendancemaster",
              "productName": "ITI Attendance Master",
              "directories": {
                "output": "release"
              },
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true
              }
            }
          }
          EOF

          cat << 'EOF' > main.js
          const { app, BrowserWindow, Menu } = require('electron');

          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1366,
              height: 850,
              minWidth: 1024,
              minHeight: 650,
              title: 'ITI Attendance Master',
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            Menu.setApplicationMenu(null);
            mainWindow.loadURL('https://ais-pre-imficyxjd7as3oyhv26rw2-489790092467.asia-southeast1.run.app');
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Install Electron & Builder
        run: npm install electron@latest electron-builder@latest --save-dev

      - name: Build Windows .exe Installer
        run: npm run dist

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Attendance-Master-Windows-Installer
          path: release/*.exe
